<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Init setup</title><style>
:root{--bg:#f6f7f9;--text:#1b2430;--muted:#4a5562;--line:#6b7480;--field:#fff;--err:#b34100}
@media (prefers-color-scheme:dark){:root{--bg:#10161d;--text:#e8edf3;--muted:#aab4bf;--line:#8b95a1;--field:#1a222b;--err:#ff8a4c}.logo .bg{stroke:var(--line);stroke-width:4}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif}
main{max-width:420px;margin:0 auto;padding:24px 16px}header{text-align:center;margin-bottom:24px}header p{margin:0}.logo{display:block;width:56px;height:56px;margin:0 auto 12px}h1{font-size:28px;margin:0 0 4px}p{margin:0 0 16px}
.muted{color:var(--muted)}.err{color:var(--err);border-left:4px solid var(--err);padding-left:12px;font-weight:600}
label{display:block;font-weight:600;margin:16px 0 4px}input[type=text],input[type=password]{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--text)}
.show{display:flex;gap:8px;align-items:center;font-weight:400;margin-top:8px}button{width:100%;margin-top:24px;padding:12px;font:inherit;font-weight:600;border:0;border-radius:8px;background:var(--text);color:var(--bg)}
</style></head><body><main>
<header><svg class="logo" viewBox="0 0 96 96" aria-hidden="true"><rect class="bg" width="96" height="96" rx="22" fill="#1b2430"/><circle cx="48" cy="20" r="8" fill="#ffc53d"/><rect x="39" y="34" width="18" height="40" rx="9" fill="none" stroke="#fff" stroke-width="5"/><rect x="45" y="48" width="6" height="22" rx="3" fill="#c2410c"/><circle cx="48" cy="72" r="12" fill="#c2410c" stroke="#fff" stroke-width="5"/></svg><h1>Init Setup</h1><p class="muted">Room monitor Wi-Fi</p></header>
<p>Saved network: <b>Room-Hotspot</b></p>
<form method="post" action="/save">
<label for="s">Network name</label>
<input type="text" id="s" name="s" maxlength="32" required autocomplete="off" autocapitalize="none" list="n" value="Room-Hotspot">
<datalist id="n"><option value="Room-Hotspot"><option value="Faculty-WiFi"></datalist>
<label for="p">Password</label>
<input type="password" id="p" name="p" maxlength="63" autocomplete="off">
<label class="show"><input type="checkbox" onchange="p.type=this.checked?'text':'password'"> Show password</label>
<button type="submit">Save and restart</button>
</form>
<p class="muted" style="margin-top:16px">Leave the password empty only for an open network. The saved password is never shown here.</p>
</main></body></html>
