<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Init: mock home-en</title>
<link rel="stylesheet" href="../../web/node_modules/@tabler/core/dist/css/tabler.min.css">
<link rel="stylesheet" href="../../web/src/tokens.css"><link rel="stylesheet" href="../../web/src/app.css"><link rel="stylesheet" href="../../web/src/school.css"><link rel="stylesheet" href="../../web/src/alerts.css">
<style>
.room-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.room-row .app-room{margin:0}
.lang-switch{display:flex;flex:none}
.lang-btn{min-height:30px;min-width:30px;padding:0 10px;font:600 12px/1 inherit;font-family:inherit;border:1.5px solid var(--tblr-body-color,#182433);background:transparent;color:inherit;cursor:pointer}
.lang-btn:first-child{border-radius:999px 0 0 999px;border-right-width:.75px}.lang-btn:last-child{border-radius:0 999px 999px 0;border-left-width:.75px}
.lang-btn[aria-pressed="true"]{background:var(--tblr-body-color,#182433);color:var(--tblr-body-bg,#fff)}
</style></head><body>
<main class="app-wrap">
  <header class="app-head"><picture class="app-logo"><source media="(prefers-color-scheme: dark)" srcset="../../web/public/logo-dark.svg"><img src="../../web/public/logo-light.svg" width="110" height="40" alt=""></picture><h1 class="app-fullname">Init: Indoor Heat Index Tracker</h1><div class="room-row"><p class="text-secondary app-room">Room: Room 204</p><div class="lang-switch" role="group" aria-label="Language / Wika">
    <button type="button" class="lang-btn" lang="en" aria-pressed="true"><span aria-hidden="true">✓ </span>English</button>
    <button type="button" class="lang-btn" lang="fil" aria-pressed="false">Filipino</button></div></div>
    <p class="status status-online" role="status"><svg viewBox="0 0 24 24" aria-hidden="true"><circle class="dot" cx="12" cy="12" r="6"/></svg>Online</p></header>
  <section class="card heat heat-extreme-caution" aria-label="Heat index"><div class="card-body">
    <p class="app-label">Heat index</p>
    <p class="heat-num">40<span class="heat-unit">°C</span></p>
    <p class="heat-cat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 22 21H2z"/></svg>Extreme caution</p>
    <a class="heat-more" href="#heat/extreme-caution">What does this mean? ›</a>
  </div></section>
  <div class="app-pair">
    <section class="card" aria-label="Temperature"><div class="card-body"><p class="app-label">Temperature</p><p class="stat">32.5 °C</p></div></section>
    <section class="card" aria-label="Humidity"><div class="card-body"><p class="app-label">Humidity</p><p class="stat">66 %</p></div></section>
  </div>
  <p class="text-secondary app-updated">updated just now</p>
  <a class="school-link" href="#school"><span>School day summary</span><span aria-hidden="true">›</span></a>
  <a class="school-link alerts-link" href="#alerts"><span>Heat alerts</span><span aria-hidden="true">›</span></a>
</main></body></html>
