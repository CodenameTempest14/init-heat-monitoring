<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Init: mock admin-sign-in-error</title>
<link rel="stylesheet" href="../../web/node_modules/@tabler/core/dist/css/tabler.min.css">
<link rel="stylesheet" href="../../web/src/tokens.css">
<link rel="stylesheet" href="../../web/src/app.css">
<link rel="stylesheet" href="../../web/src/charts.css">
<link rel="stylesheet" href="../../web/src/school.css">
<link rel="stylesheet" href="../../web/src/admin.css">
</head>
<body>
<main class="app-wrap">
  <header class="app-head"><picture class="app-logo"><source media="(prefers-color-scheme: dark)" srcset="../../web/public/logo-dark.svg"><img src="../../web/public/logo-light.svg" width="110" height="40" alt=""></picture><h1 class="app-fullname">Init: Indoor Heat Index Tracker</h1></header>
  <a class="school-back" href="#">‹ Live readings</a>
  <h2 class="admin-title">Admin sign in</h2>
  <p class="admin-intro">Only the school's admin has an account. Viewing the readings needs no sign-in.</p>
  <form class="card admin-card"><div class="card-body">
    <div class="alert alert-danger" role="alert">Email or password is wrong.</div>
    <div class="admin-field"><label class="form-label" for="email">Email address</label>
      <input class="form-control" id="email" type="email" autocomplete="username" value="admin@example.com" placeholder="admin@school.example"></div>
    <div class="admin-field"><label class="form-label" for="pw">Password</label>
      <input class="form-control" id="pw" type="password" autocomplete="current-password" value="xxxxxxxxxxxx"></div>
    <button type="submit" class="btn btn-primary w-100 admin-btn">Sign in</button>
  </div></form>
</main>
</body>
</html>
