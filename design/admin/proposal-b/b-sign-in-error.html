<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Init: mock B b-sign-in-error</title>
<link rel="stylesheet" href="../../../web/node_modules/@tabler/core/dist/css/tabler.min.css">
<link rel="stylesheet" href="../../../web/src/tokens.css">
<link rel="stylesheet" href="../../../web/src/app.css">
<link rel="stylesheet" href="../../../web/src/charts.css">
<link rel="stylesheet" href="../../../web/src/school.css">
<link rel="stylesheet" href="admin-b.css">
</head>
<body>
<main class="app-wrap">
  <header class="app-head"><picture class="app-logo"><source media="(prefers-color-scheme: dark)" srcset="../../../web/public/logo-dark.svg"><img src="../../../web/public/logo-light.svg" width="110" height="40" alt=""></picture><h1 class="app-fullname">Init: Indoor Heat Index Tracker</h1></header>
  <a class="school-back" href="#">‹ Live readings</a>
  <div class="ab-center"><form class="card ab-card"><div class="card-body">
    <div class="ab-badge"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
    <h2 class="ab-title">Admin</h2>
    <p class="ab-sub">Sign in to change the room and settings.</p>
    <div class="ab-alert" role="alert"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16v.01"/></svg>Email or password is wrong.</div>
    <div class="ab-field"><label class="visually-hidden" for="email">Email address</label>
      <div class="input-icon"><span class="input-icon-addon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span>
      <input class="form-control" id="email" type="email" autocomplete="username" placeholder="Email address" value="admin@example.com"></div></div>
    <div class="ab-field"><label class="visually-hidden" for="pw">Password</label>
      <div class="input-icon position-relative"><span class="input-icon-addon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="m10.8 12.2 7.2-7.2M15 8l3 3M17 6l2 2"/></svg></span>
      <input class="form-control" id="pw" type="password" autocomplete="current-password" placeholder="Password" value="xxxxxxxxxxxx">
      <button type="button" class="ab-eye" aria-label="Show password"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
    <button type="submit" class="btn btn-primary w-100 ab-btn">Sign in</button>
  </div></form>
  <p class="ab-foot">Viewing the readings needs no sign-in.</p></div>
</main>
</body>
</html>
