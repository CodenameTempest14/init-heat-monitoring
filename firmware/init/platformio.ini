; Product firmware for the Init room monitor (P03). The bench sketch in ../bench is throw-away.
[env:esp32dev]
; platform version pinned so a build next year gives the same result
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; slow upload: the default 921600 gave "Invalid head of packet" on the owner's board and cable
upload_speed = 115200
; exact versions, same set the bench sketch was tested with on the real board
lib_deps =
    adafruit/DHT sensor library@1.4.7
    adafruit/Adafruit Unified Sensor@1.1.15
    adafruit/Adafruit SSD1306@2.5.17
    adafruit/Adafruit GFX Library@1.13.0
    adafruit/Adafruit BusIO@1.17.4
